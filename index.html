
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Pages Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 80px 20px;
      background: #f4f6f8;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 15px 25px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🚀 GitHub Pages Works!</h1>
  <p>My first website hosted on GitHub.</p>

  <button onclick="test()">Click to Test</button>
  <p id="result"></p>

  <script>
    function test() {
      document.getElementById("result").innerText =
        "✅ JavaScript is working!";
    }
  </script>
</body>
</html>
